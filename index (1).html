<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сигна от Васи</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #121212;
            --surface-variant: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --accent-color: #ffffff;
            --accent-bg: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        /* Задний фон со снегопадом */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Основной контейнер в стиле интерфейса на фото */
        .profile-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            background: var(--surface-color);
            border: 1px solid #222222;
            border-radius: 28px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
        }

        .profile-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(255, 255, 255, 0.05);
        }

        /* Имитация верхней панели приложения */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 30px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #4cd964;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }

        /* Текстовые стили - строгий минимализм без неона */
        .title {
            font-size: 22px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
            animation: fadeIn 0.8s ease-out;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 40px;
            padding: 0 10px;
            animation: fadeIn 1s ease-out;
        }

        /* Кнопка в стиле нижней панели "Добавить" */
        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.2s ease, transform 0.1s ease;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }

        .cta-button:hover {
            background-color: #e5e5e5;
            transform: scale(1.02);
        }

        .cta-button:active {
            transform: scale(0.98);
        }

        .cta-button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Анимации */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <canvas id="snowCanvas"></canvas>

    <div class="profile-container">
        <div class="app-header">
            <div><span class="status-dot"></span>в сети</div>
            <div style="font-weight: bold; letter-spacing: 2px;">•••</div>
        </div>
        
        <h1 class="title">привет, получи сигну от такого красавца как я! Не упусти😏.</h1>
        <p class="subtitle">жми на кнопку и пиши мне "сигна от васи"</p>
        
        <a href="https://t.me/vasiaprobot" target="_blank" class="cta-button">
            <!-- Иконка сообщения/самолетика Telegram -->
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15.75-.7 3.97-.98 5.48-.12.64-.36.85-.59.87-.5.05-.88-.33-1.37-.65-.76-.5-1.19-.81-1.93-1.3-0.86-.56-.3-.87.19-1.38.13-.13 2.34-2.15 2.38-2.33.01-.02.01-.11-.04-.16-.06-.05-.14-.03-.2-.02-.09.02-1.52.96-4.29 2.83-.41.28-.78.42-1.11.41-.37-.01-1.07-.21-1.6-.38-.64-.21-1.16-.32-1.11-.68.02-.19.28-.39.77-.58 3.01-1.31 5.02-2.18 6.03-2.6 2.87-1.2 3.46-1.41 3.85-1.41.09 0 .28.02.4.12.1.09.13.21.14.32-.01.05-.01.14-.02.2z"/>
            </svg>
            Отправить сообщение
        </a>
    </div>

    <script>
        // Скрипт интерактивного снегопада
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const numFlakes = 80;
        const flakes = [];

        for (let i = 0; i < numFlakes; i++) {
            flakes.push({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 2 + 1, // мелкие аккуратные снежинки
                d: Math.random() * numFlakes,
                speed: Math.random() * 1 + 0.5
            });
        }

        // Интерактив с мышкой: снежинки слегка разлетаются от курсора
        let mouse = { x: -1000, y: -1000 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        function draw() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.beginPath();
            
            for (let i = 0; i < numFlakes; i++) {
                const f = flakes[i];
                ctx.moveTo(f.x, f.y);
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
                
                // Движение вниз и вбок
                f.y += f.speed;
                f.x += Math.sin(f.d) * 0.5;

                // Интерактивное взаимодействие с курсором
                const dx = f.x - mouse.x;
                const dy = f.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 80) {
                    const forceX = dx / dist;
                    const forceY = dy / dist;
                    f.x += forceX * 3;
                    f.y += forceY * 3;
                }

                // Перенос снежинки наверх, если она улетела
                if (f.y > height) {
                    flakes[i] = { x: Math.random() * width, y: 0, r: f.r, d: f.d, speed: f.speed };
                }
                if (f.x > width) f.x = 0;
                else if (f.x < 0) f.x = width;
            }
            
            ctx.fill();
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
